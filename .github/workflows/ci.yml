name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # @mushilu-san/ui is a private package of another owner: GITHUB_TOKEN cannot read it.
      - uses: ./.github/actions/setup
        with:
          token: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: npm test
      - run: npm run test:scripts
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # @mushilu-san/ui is a private package of another owner: GITHUB_TOKEN cannot read it.
      - uses: ./.github/actions/setup
        with:
          token: ${{ secrets.PACKAGES_READ_TOKEN }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          INCLUDE_DRAFTS: '1'
      - run: npm run e2e
        env:
          CI: 'true'
