# Version-update PRs are off (open-pull-requests-limit: 0): scripts/outdated-issue.sh reports them in one issue.
# The entries stay so Dependabot security updates keep working.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
