<div class="container section">
  <header class="projects__intro">
    <h1>Projects</h1>
    <p class="projects__lead">Things I've built: side projects and university work.</p>
  </header>

  @for (group of groups(); track group.id) {
    <section class="projects__group" [attr.aria-labelledby]="group.id">
      <h2 [id]="group.id" class="section__title">{{ group.title }}</h2>
      <div class="projects__grid">
        @for (project of group.projects; track project.slug) {
          <app-project-card [project]="project" />
        }
      </div>
    </section>
  } @empty {
    <p class="projects__empty">Projects are on the way.</p>
  }
</div>
