<footer class="site-footer">
  <section id="contact" class="container site-footer__contact" aria-labelledby="contact-title">
    <div>
      <h2 id="contact-title" class="site-footer__title">Contact</h2>
      <p class="site-footer__lead">
        Email is the fastest way to reach me:
        <a class="site-footer__email" [href]="email.href">{{ email.address }}</a>
      </p>
    </div>
    <ul class="site-footer__social">
      @for (link of social; track link.label) {
        <li>
          <a
            muiButton
            variant="secondary"
            [href]="link.href"
            [attr.target]="link.external ? '_blank' : null"
            [attr.rel]="link.external ? 'noopener noreferrer' : null"
          >
            <mui-icon muiButtonIconStart [name]="link.icon" />
            {{ link.label }}
            @if (link.external) {
              <span class="visually-hidden">(opens in a new tab)</span>
            }
          </a>
        </li>
      }
    </ul>
  </section>
  <div class="container site-footer__inner">
    <p class="site-footer__copy">
      © {{ year }} {{ author }} · <a class="site-footer__link" routerLink="/accessibility">Accessibility</a>
    </p>
  </div>
</footer>
