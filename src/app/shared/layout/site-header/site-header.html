<mui-site-header class="site-header" [(open)]="menuOpen">
  <a slot="brand" class="site-header__brand" routerLink="/" (click)="menuOpen.set(false)">
    <span class="site-header__logo" aria-hidden="true">MZ</span>
    <span class="site-header__name">Moris Maor Zakay</span>
  </a>

  <app-theme-toggle slot="actions" />

  <!-- The library header closes the menu on a link click and on Escape, and returns focus to its button. -->
  <ul class="site-header__links">
    @for (link of links; track link.path) {
      <li>
        @if (link.external) {
          <a muiNavLink [href]="link.path" target="_blank" rel="noopener noreferrer" [attr.aria-label]="link.label + ' (opens in a new tab)'">
            {{ link.label }}
          </a>
        } @else {
          <a muiNavLink [routerLink]="link.path" [active]="link.active!()">{{ link.label }}</a>
        }
      </li>
    }
  </ul>
</mui-site-header>
